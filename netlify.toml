# =============================================================
# Netlify hosts the static campaign page only.
#
# The API and the admin dashboard stay on xpeng.heineraboka.site —
# the dashboard must remain same-origin with its API so the session
# cookie can keep SameSite=Strict.
#
# Two things must line up with this file:
#   1. config.js  -> api.base = "https://xpeng.heineraboka.site"
#   2. server .env -> ALLOWED_ORIGINS includes this site's URL
# =============================================================

[build]
  # Copy only the front-end into dist/ and publish that. Publishing the
  # repo root would also upload backend/, including the admin HTML —
  # harmless but confusing, and it would serve a second, broken copy of
  # the dashboard from the wrong origin.
  # SITE_OFFLINE=true in the Netlify UI (Site configuration ->
  # Environment variables) publishes the holding page instead of the
  # campaign. Nothing is deleted: unset it, redeploy, and the real site
  # is back. Toggling needs no commit and no code change.
  command = """
    rm -rf dist && mkdir -p dist &&
    if [ "$SITE_OFFLINE" = "true" ]; then
      cp maintenance.html dist/index.html &&
      cp favicon.ico favicon.svg dist/ &&
      printf 'User-agent: *
Disallow: /
' > dist/robots.txt &&
      exit 0;
    fi &&
    cp index.html styles.css app.js config.js geo.js dist/ &&
    cp privacy.html terms.html legal.css dist/ &&
    cp favicon.ico favicon.svg site.webmanifest robots.txt dist/ &&
    cp -r image font dist/
  """
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # connect-src must name the API host, or the browser blocks the
    # form POST. Google Fonts serves IBM Plex Mono; the brand faces are
    # self-hosted, so no other origin is needed.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://xpeng.heineraboka.site; frame-ancestors 'self'"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.js"
  [headers.values]
    # Short TTL: config.js carries the artist-reveal switch and the
    # confirmation-copy mode, both of which must change within minutes
    # without a redeploy.
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/font/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The dashboard lives on the API host. Anyone who tries /admin here
# gets sent to the real one rather than a 404.
[[redirects]]
  from = "/admin/*"
  to = "https://xpeng.heineraboka.site/admin/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://xpeng.heineraboka.site/api/:splat"
  status = 307
  force = true
