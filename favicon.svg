<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>XPENG</title>
  <!-- Theme-aware favicon.
       The supplied mark is white, which disappears on a light browser
       tab strip and looked like a black box on a dark one when it was
       baked onto a dark tile. So the tile is drawn HERE, and only in
       light mode; in dark mode the background stays transparent and
       the white mark sits directly on the tab. -->
  <style>
    .tile { fill: #0B0907; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: none; }
    }
  </style>
  <rect class="tile" width="256" height="256" rx="38"/>
  <image x="0" y="0" width="256" height="256" href="data:image/png;base64,"/>
</svg>
